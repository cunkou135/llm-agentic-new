[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emergence-attribution"
version = "0.1.0"
description = "Auditable multiscale emergence attribution experiments"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "networkx>=3.2",
  "numpy>=1.26",
  "openai>=1.40",
  "pandas>=2.1",
  "pyarrow>=15",
  "pydantic>=2.6",
  "rich>=13.7",
  "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

